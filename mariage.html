<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Site officiel du mariage de Sarah & Thomas - 12 Juin 2025">
    <title>Mariage de Sarah & Thomas - 12 Juin 2025</title>
    
    <!-- Polices -->
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <style>
        :root {
            --primary-color: #F8E9E9;
            --secondary-color: #A8DADC;
            --accent-color: #E63946;
        }

        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            line-height: 1.6;
        }

        h1, h2 {
            font-family: 'Lora', serif;
        }

        /* Navigation */
        .navbar {
            position: sticky;
            top: 0;
            background: white;
            padding: 1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .nav-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            list-style: none;
        }

        /* Bannière */
        .hero {
            height: 60vh;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), 
                        url('hero-bg.jpg') center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }

        /* Galerie */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            padding: 2rem;
        }

        .gallery-item {
            transition: transform 0.3s ease;
        }

        .gallery-item:hover {
            transform: scale(1.03);
        }

        /* Formulaire */
        .registration-form {
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
            background: var(--primary-color);
            border-radius: 10px;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-links {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="#accueil">Accueil</a></li>
            <li><a href="#programme">Programme</a></li>
            <li><a href="#galerie">Galerie</a></li>
            <li><a href="#infos">Infos pratiques</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Bannière principale -->
    <section class="hero" id="accueil">
        <div class="hero-content">
            <h1>Mariage de Sarah & Thomas</h1>
            <p>12 Juin 2025 - Château de Versailles</p>
        </div>
    </section>

    <!-- Programme -->
    <section id="programme" class="section">
        <h2>Déroulement de la journée</h2>
        <div class="timeline">
            <!-- Éléments du programme -->
        </div>
    </section>

    <!-- Galerie -->
    <section id="galerie" class="section">
        <h2>Nos moments de bonheur</h2>
        <div class="gallery-grid">
            <!-- Images -->
        </div>
    </section>

    <!-- Carte interactive -->
    <section id="infos" class="section">
        <h2>Accès au lieu</h2>
        <div class="map-container">
            <iframe 
                src="https://www.google.com/maps/embed?pb=..." 
                width="100%" 
                height="450" 
                style="border:0;" 
                allowfullscreen="">
            </iframe>
        </div>
    </section>

    <!-- Formulaire d'inscription -->
    <section id="inscription" class="section">
        <form class="registration-form" action="https://formspree.io/f/your-form-id" method="POST">
            <div class="form-group">
                <label>Nom complet :</label>
                <input type="text" name="name" required>
            </div>
            
            <div class="form-group">
                <label>Email :</label>
                <input type="email" name="email" required>
            </div>

            <div class="form-group">
                <label>Nombre de participants :</label>
                <select name="participants">
                    <option value="1">1</option>
                    <option value="2">2</option>
                </select>
            </div>

            <button type="submit">Confirmer ma présence</button>
        </form>
    </section>

    <script>
        // Smooth scroll pour la navigation
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });

        // Animation au défilement
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if(entry.isIntersecting) {
                    entry.target.classList.add('show');
                }
            });
        });

        document.querySelectorAll('.section').forEach((el) => observer.observe(el));
    </script>
</body>
</html>
